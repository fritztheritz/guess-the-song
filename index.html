<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0b0e14" />
    <title>Buzzer Beats — Friday Night Music Game</title>
    <meta name="description" content="A basketball-themed party trivia game — guess the song, the lyric, the year, or the ranking — built from your SoundCloud & Spotify library." />
    <script type="text/javascript">
      // Other half of the GitHub Pages SPA fallback started in 404.html — decodes the
      // encoded path back into a real URL (history.replaceState, no reload) before React
      // Router mounts below, so a direct load of e.g. /guess-the-song/admin ends up with
      // the URL bar showing /guess-the-song/admin, not the intermediate ?/admin form.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
