<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guess the Track</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback (rafgraph/spa-github-pages) — GH Pages serves this
      // file for any path it doesn't recognize as a static file (e.g. a direct load of
      // /guess-the-song/admin). It encodes the requested path into a query string and
      // bounces back to the real index.html, whose restore script (see index.html)
      // decodes it back into the URL bar before React Router mounts.
      //
      // pathSegmentsToKeep = 1 matches the current base path (/guess-the-song/) — update
      // this if the repo/base path ever changes (see vite.config.ts).
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
