name = "guess-the-song-auth"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Comma-separated list of origins allowed to call this proxy. Update the
# github.io one with your actual username if it differs, and add your local
# dev origin (Vite's default) so `npm run dev` can exercise the real flow too.
#
# SOUNDCLOUD_CLIENT_ID isn't secret (it's already public in the frontend bundle),
# so it lives here. SOUNDCLOUD_CLIENT_SECRET must NEVER go in this file — set it
# as a Worker secret instead: wrangler secret put SOUNDCLOUD_CLIENT_SECRET
[vars]
ALLOWED_ORIGINS = "https://fritztheritz.github.io,http://127.0.0.1:5173"
SOUNDCLOUD_CLIENT_ID = "4RRAqFiWAlqK8OEswaRSzSgHHcZK6PrD"

# Phone buzz-in (Host Controller <-> player phones): one Durable Object instance per room
# code holds the live WebSocket connections, so "who buzzed first" is decided in one place
# instead of needing an external pub/sub service.
[[durable_objects.bindings]]
name = "BUZZER_ROOM"
class_name = "BuzzerRoom"

[[migrations]]
tag = "v1"
# Free-plan accounts require Durable Objects to be SQLite-backed (new_sqlite_classes)
# even though BuzzerRoom never touches ctx.storage — its state is deliberately plain
# in-memory fields (see the comment in buzzer-room.js), this is just what Cloudflare
# requires to provision the class at all on this plan.
new_sqlite_classes = ["BuzzerRoom"]
