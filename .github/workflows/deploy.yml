name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Client ID isn't secret in the same way a client_secret would be (PKCE public
      # client, spec §2), but it's still repo-specific config — set it as a repo
      # variable (Settings → Secrets and variables → Actions → Variables) rather
      # than committing it.
      - name: Build
        env:
          VITE_SOUNDCLOUD_CLIENT_ID: ${{ vars.VITE_SOUNDCLOUD_CLIENT_ID }}
          VITE_SOUNDCLOUD_REDIRECT_URI: ${{ vars.VITE_SOUNDCLOUD_REDIRECT_URI }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
